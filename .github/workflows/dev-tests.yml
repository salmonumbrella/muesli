name: Dev tests (fork-only harness)
on:
  push:
    branches: [ci/dev-harness]
    paths: [.github/dev-run.json]
concurrency:
  group: dev-tests-${{ github.sha }}
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Read run request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh api "repos/${{ github.repository }}/contents/.github/dev-run.json?ref=${{ github.sha }}" --jq .content | base64 -d)
          echo "$body"
          echo "sha=$(jq -r .sha <<<"$body")" >> "$GITHUB_OUTPUT"
          echo "filter=$(jq -r '.filter // ""' <<<"$body")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.sha }}
          persist-credentials: false
      - name: Verify tested SHA
        env:
          EXPECTED: ${{ steps.req.outputs.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          echo "tested=$actual"
          test "$actual" = "$EXPECTED"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: native/MuesliNative/.build
          key: dev-tests-xcode26.6-${{ hashFiles('native/MuesliNative/Package.resolved') }}-${{ steps.req.outputs.sha }}
          restore-keys: dev-tests-xcode26.6-${{ hashFiles('native/MuesliNative/Package.resolved') }}-
      - name: Build tests
        run: swift build --package-path native/MuesliNative --build-tests
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: native/MuesliNative/.build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Run filtered tests
        if: steps.req.outputs.filter != ''
        env:
          FILTER: ${{ steps.req.outputs.filter }}
        run: swift test --package-path native/MuesliNative --skip-build --no-parallel --filter "$FILTER"
