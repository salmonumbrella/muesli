name: Call identity development
on:
  workflow_dispatch:
  pull_request:
jobs:
  contracts:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .build
          key: call-identity-core-26-6-${{ github.sha }}
          restore-keys: call-identity-core-26-6-
      - name: Isolate dependency-free core tests
        run: |
          cat > Package.swift <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(name: "CallIdentityDevelopment", platforms: [.macOS("14.2")], targets: [
              .target(name: "MuesliCore", path: "native/MuesliNative/Sources/MuesliCore", linkerSettings: [.linkedLibrary("sqlite3")]),
              .testTarget(name: "MuesliTests", dependencies: ["MuesliCore"], path: "native/MuesliNative/Tests/MuesliTests", sources: ["CallIdentityModelTests.swift", "CallIdentityStoreTests.swift"], resources: [.copy("Fixtures/CallIdentity")], linkerSettings: [.linkedLibrary("sqlite3")])
          ])
          SWIFT
      - name: Call identity tests
        run: swift test --filter CallIdentity
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
